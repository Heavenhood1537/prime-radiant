<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiant of Human Consciousness</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    
    #controls {
      position: absolute; top: 10px; left: 10px; background: rgba(10, 25, 47, 0.9);
      color: #8892b0; padding: 15px; border-radius: 8px;
      width: 220px; font-size: 11px; border: 1px solid #1e3a8a; z-index: 10;
    }

    #results-panel {
      position: absolute; top: 10px; right: 10px; background: rgba(10, 25, 47, 0.95);
      color: #ccd6f6; padding: 15px; border-radius: 8px;
      width: 220px; max-height: 90vh; overflow-y: auto; font-size: 12px;
      display: block; border: 1px solid #1e3a8a; z-index: 10;
    }

    h2 { margin: 0 0 10px 0; color: #007fff; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px; }
    h4 { margin: 12px 0 5px 0; color: #64ffda; font-size: 10px; text-transform: uppercase; }
    
    input, select, button {
      width: 100%; margin-top: 5px; background: #112240; color: #ccd6f6;
      border: 1px solid #233554; padding: 8px; cursor: pointer; transition: 0.3s;
      font-weight: bold; border-radius: 4px; box-sizing: border-box; font-size: 11px;
    }

    .navy-btn { background: #1e3a8a; border: 1px solid #3b82f6; color: #dbeafe; text-transform: uppercase; }
    .navy-btn:hover { background: #1e40af; }
    
    .search-input { background: #0a192f; border: 1px solid #1e3a8a; color: #64ffda; padding: 6px; margin-bottom: 5px; cursor: text; }

    .legend-item { display: flex; align-items: center; margin-top: 4px; font-size: 9px; color: #8892b0; }
    .color-box { width: 8px; height: 8px; margin-right: 6px; border-radius: 1px; }
    .search-group { border-bottom: 1px solid #233554; padding-bottom: 12px; margin-bottom: 12px; }
    .stack { display: flex; flex-direction: column; gap: 2px; }
  </style>
</head>
<body>

  <div id="controls">
    <h2>Prime Radiant</h2>
    <button class="navy-btn" onclick="filterPast()">Past Milestones</button>
    <button class="navy-btn" onclick="filterFuture()">Future Vision</button>
    
    <div id="stats" style="margin-top:10px; color: #4b5563; font-style: italic; font-size: 10px;">Initializing...</div>
    
    <select id="categoryFilter" style="margin-top: 15px;">
      <option value="all">Categories</option>
    </select>
    
    <div id="legend" style="margin-top:10px;"></div>
    <button onclick="resetView()" style="background: #0f172a; color: #475569; border: 1px solid #1e293b; margin-top: 15px; font-size: 10px;">Reset View</button>
  </div>

  <div id="results-panel">
    <div class="search-group">
      <h4>Temporal Range</h4>
      <div class="stack">
        <input type="number" id="yearFrom" class="search-input" placeholder="Start Year">
        <input type="number" id="yearTo" class="search-input" placeholder="End Year">
      </div>
      <button class="navy-btn" onclick="searchByPeriod()">Filter Period</button>

      <h4>Keyword Search</h4>
      <input type="text" id="textSearch" class="search-input" placeholder="Keyword...">
      <button class="navy-btn" onclick="searchByText()">Search</button>
    </div>

    <div id="milestone-detail">
      <h3 id="panel-title" style="color:#007fff; font-size: 13px; margin: 0;">System Ready</h3>
      <div id="panel-content" style="color:#a8b2d1; margin-top: 10px; line-height: 1.4;">Select a node or use search tools.</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, milestoneMeshes = [], allMilestones = [];
    const oldestAnchor = -3300000;

    function normalizeYear(year) {
      const scale = 300; 
      return ((year - oldestAnchor) / Math.abs(oldestAnchor)) * scale;
    }

    function getCategoryColor(category) {
      const colors = {
        'technology': 0x4682b4, 'science': 0x5f9ea0, 'communication': 0xbdb76b,
        'space exploration': 0x483d8b, 'urban': 0x708090, 'governance': 0x8b4513,
        'philosophy': 0xe6e6fa, 'future vision': 0x008b8b, 'evolution': 0x556b2f,
        'archaeology': 0xbc8f8f, 'industry': 0x2f4f4f, 'medicine': 0x800000,
        'economics': 0x9acd32, 'planetary stewardship': 0x228b22, 'food': 0xd2691e
      };
      return colors[category.toLowerCase()] || 0x1e3a8a;
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 4000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x444444));
      const light = new THREE.PointLight(0xffffff, 1.0);
      camera.add(light);
      scene.add(camera);
      scene.add(new THREE.GridHelper(600, 30, 0x0a192f, 0x0a192f));

      loadData();

      camera.position.set(450, 450, 450);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      animate();
    }

    async function loadData() {
      const response = await fetch('./milestones.json');
      const data = await response.json();
      allMilestones = data.milestones;
      allMilestones.forEach(m => { if(m.title.includes("Dog Domestication")) m.category = "evolution"; });
      document.getElementById('stats').innerText = `${allMilestones.length} Milestones Synced`;
      populateUI();
      renderPoints(allMilestones);
    }

    function populateUI() {
      const categories = [...new Set(allMilestones.map(m => m.category))].sort();
      const filter = document.getElementById('categoryFilter');
      const legend = document.getElementById('legend');
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
        filter.appendChild(opt);
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="color-box" style="background: #${getCategoryColor(cat).toString(16).padStart(6, '0')}"></div>${cat}`;
        legend.appendChild(item);
      });
      filter.addEventListener('change', (e) => {
        clearSearchFields(); // Clear search when switching categories
        if(e.target.value === 'all') renderPoints(allMilestones);
        else renderPoints(allMilestones.filter(m => m.category === e.target.value));
      });
    }

    // NEW CONSOLE CLEAR FUNCTION
    function clearSearchFields() {
      document.getElementById('textSearch').value = "";
      document.getElementById('yearFrom').value = "";
      document.getElementById('yearTo').value = "";
    }

    function searchByPeriod() {
      document.getElementById('textSearch').value = ""; 
      const from = parseInt(document.getElementById('yearFrom').value) || -4000000;
      const to = parseInt(document.getElementById('yearTo').value) || 2500;
      renderPoints(allMilestones.filter(m => m.year >= from && m.year <= to));
    }

    function searchByText() {
      document.getElementById('yearFrom').value = ""; 
      document.getElementById('yearTo').value = "";   
      const term = document.getElementById('textSearch').value.toLowerCase();
      renderPoints(allMilestones.filter(m => 
        m.title.toLowerCase().includes(term) || 
        m.description.toLowerCase().includes(term)
      ));
    }

    function filterPast() { clearSearchFields(); renderPoints(allMilestones.filter(m => m.year <= 2026)); }
    function filterFuture() { clearSearchFields(); renderPoints(allMilestones.filter(m => m.year > 2026)); }

    function renderPoints(dataToRender) {
      milestoneMeshes.forEach(m => scene.remove(m));
      milestoneMeshes = [];
      dataToRender.forEach(m => {
        const geometry = new THREE.SphereGeometry(2.8, 12, 12);
        const material = new THREE.MeshPhongMaterial({ color: getCategoryColor(m.category), emissive: getCategoryColor(m.category), emissiveIntensity: 0.2 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(m.location.lat * 2.8, normalizeYear(m.year), m.location.lon * 2.2);
        mesh.userData = m; 
        scene.add(mesh);
        milestoneMeshes.push(mesh);
      });
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    
    function resetView() { 
      clearSearchFields();
      camera.position.set(450, 450, 450); 
      renderPoints(allMilestones); 
      document.getElementById('categoryFilter').value = 'all'; 
    }

    window.addEventListener('click', (e) => {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(milestoneMeshes);
      if (intersects.length > 0) {
        const m = intersects[0].object.userData;
        document.getElementById('panel-title').innerText = m.title;
        document.getElementById('panel-content').innerHTML = `
          <p><strong style="color:#64ffda">Year:</strong> ${m.year > 0 ? m.year : Math.abs(m.year) + ' BCE'}</p>
          <p><strong style="color:#64ffda">Context:</strong> ${m.culture || m.humanType}</p>
          <hr style="border:0; border-top:1px solid #233554; margin: 10px 0;">
          <p style="color:#ccd6f6;">${m.description}</p>
          <a href="${m.url}" target="_blank" style="color: #64ffda; text-decoration:none; font-size:10px;">[ SOURCE ]</a>
        `;
      }
    });

    init();
  </script>
</body>
</html>
